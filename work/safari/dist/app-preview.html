<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>寻兽记 · iPhone App 预览</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #202d28; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
  /* iPhone 15 / 16 logical size: 393 × 852 pt; status bar 59 pt; home indicator inset 34 pt */
  .phone { position: relative; width: 393px; height: 852px; padding: 12px; border-radius: 55px; background: #0b0f0d; box-shadow: 0 28px 80px #0009, inset 0 0 0 1px #58605c; overflow: hidden; }
  .screen { position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; overflow: hidden; border-radius: 44px; background: #fff; }
  .statusbar { position: relative; flex: none; height: 59px; background: #fff; color: #000; }
  .statusbar .time { position: absolute; left: 0; top: 17px; width: 133px; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: -.3px; line-height: 22px; }
  .statusbar .indicators { position: absolute; right: 0; top: 21px; width: 133px; display: flex; justify-content: center; align-items: center; gap: 7px; }
  .statusbar svg { display: block; }
  .island { position: absolute; z-index: 3; top: 11px; left: 50%; width: 126px; height: 37px; transform: translateX(-50%); border-radius: 20px; background: #030504; pointer-events: none; }
  iframe { display: block; flex: 1; width: 100%; min-height: 0; border: 0; background: #fff; }
  .home { position: absolute; z-index: 3; left: 50%; bottom: 8px; width: 139px; height: 5px; transform: translateX(-50%); border-radius: 3px; background: #000; opacity: .9; pointer-events: none; }
  @media (max-width: 500px) { body { place-items: stretch; } .phone { width: 100vw; height: 100dvh; padding: 0; border-radius: 0; box-shadow: none; } .screen { border-radius: 0; } }
</style>
<main class="phone" aria-label="iPhone 15/16 App 预览">
  <div class="screen">
    <div class="statusbar" aria-hidden="true">
      <span class="time">9:41</span>
      <div class="island"></div>
      <div class="indicators">
        <svg width="19" height="12" viewBox="0 0 19 12" fill="#000"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.3a10.5 10.5 0 0 1 14 0"/><path d="M4.3 7.1a6.5 6.5 0 0 1 8.4 0"/><path d="M7.1 9.9a2.6 2.6 0 0 1 2.8 0"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#000" stroke-opacity=".35"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#000"/><path d="M25 4.5v4a2.1 2.1 0 0 0 0-4z" fill="#000" fill-opacity=".4"/></svg>
      </div>
    </div>
    <iframe title="寻兽记 iPhone App" src="./index.html?preview=iphone"></iframe>
    <div class="home"></div>
  </div>
</main>
</html>
